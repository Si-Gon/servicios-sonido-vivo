spring.application.name=mensajeria


spring.datasource.url=jdbc:mysql://localhost:3306/mensajeria

spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

server.port=8095
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion

# Registro de servicios: si eureka no esta arriba, el servicio igual arranca
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Configuracion compartida. Es opcional: si el servidor de configuracion no esta arriba,
# el servicio arranca igual con lo que tiene en este archivo.
spring.config.import=optional:configserver:http://localhost:8888
