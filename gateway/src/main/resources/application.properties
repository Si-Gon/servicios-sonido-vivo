spring.application.name=gateway
# 8080 lo ocupa Docker en este equipo, por eso el gateway usa 8090
server.port=8090

# Se anuncia en eureka para que el resto lo vea, y encuentra los servicios por su nombre.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Rutas: la ruta publica del front se traduce al servicio que corresponde.
spring.cloud.gateway.server.webflux.routes[0].id=mensajeria
spring.cloud.gateway.server.webflux.routes[0].uri=lb://mensajeria
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/contacto/**

spring.cloud.gateway.server.webflux.routes[1].id=catalogo
spring.cloud.gateway.server.webflux.routes[1].uri=lb://catalogo
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/productos/**,/api/categorias/**

spring.cloud.gateway.server.webflux.routes[2].id=usuarios
spring.cloud.gateway.server.webflux.routes[2].uri=lb://usuarios
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/usuarios/**,/api/auth/**

spring.cloud.gateway.server.webflux.routes[3].id=pedidos
spring.cloud.gateway.server.webflux.routes[3].uri=lb://pedidos
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/pedidos/**,/api/despachos/**

# El front de Vite viene de otro origen: el gateway es el unico que abre CORS.
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*

# Configuracion compartida. Es opcional: si el servidor de configuracion no esta arriba,
# el servicio arranca igual con lo que tiene en este archivo.
spring.config.import=optional:configserver:http://localhost:8888
