spring.application.name=usuarios


# createDatabaseIfNotExist crea la base en el motor si no existe: en otro PC no hay que
# crearla a mano, Flyway se encarga de las tablas.
spring.datasource.url=jdbc:mysql://localhost:3306/usuarios?createDatabaseIfNotExist=true

spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

server.port=8092
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migracion

# Configuracion compartida. Es opcional: si el servidor de configuracion no esta arriba,
# el servicio arranca igual con lo que tiene en este archivo.
spring.config.import=optional:configserver:http://localhost:8888

# Registro de servicios
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
